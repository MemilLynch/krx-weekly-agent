name: Daily KRX Quant Agent

on:
  schedule:
    # 한국 시간(KST) 평일 16:10 자동 실행 (UTC 07:10)
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install requests beautifulsoup4 pandas

      - name: 기관 퀀트 데이터 추출 및 발송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > run_agent.py
          import os
          import sys
          import time
          import json
          import datetime
          import requests
          from bs4 import BeautifulSoup
          import pandas as pd
          import re

          # -------------------------------------------------------------
          # 0. 전송 대상 채널 설정
          # -------------------------------------------------------------
          TARGET_CHANNEL = "@MemilLynch"

          raw_gemini_key = os.getenv("GEMINI_API_KEY", "")
          raw_bot_token = os.getenv("TELEGRAM_BOT_TOKEN", "")
          raw_chat_id = os.getenv("TELEGRAM_CHAT_ID", "")

          gemini_key = raw_gemini_key.strip().strip("'").strip('"')
          bot_token = raw_bot_token.strip().strip("'").strip('"')
          chat_id = TARGET_CHANNEL if TARGET_CHANNEL else raw_chat_id.strip().strip("'").strip('"')

          if bot_token.lower().startswith("bot"):
              bot_token = bot_token[3:]

          if not gemini_key or not bot_token:
              print("❌ 환경변수 오류: API 키 누락")
              sys.exit(1)

          HTTP_SCHEME = "https://"
          NAVER_DOMAIN = "finance.naver.com"
          GEMINI_DOMAIN = "generativelanguage.googleapis.com"
          TG_DOMAIN = "api.telegram.org"
          tg_base_url = f"{HTTP_SCHEME}{TG_DOMAIN}/bot{bot_token}"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Referer": f"{HTTP_SCHEME}{NAVER_DOMAIN}/"
          }

          # -------------------------------------------------------------
          # 1. 기관별 거래량 점유율(VPR) 정밀 추출 로직
          # -------------------------------------------------------------
          def fetch_quant_deal_rank(mkt_gb, investor_gubun, top_n=15):
              url = f"{HTTP_SCHEME}{NAVER_DOMAIN}/sise/sise_deal_rank_iframe.naver?investor_gubun={investor_gubun}&type=buy&mkt_gb={mkt_gb}"
              res = requests.get(url, headers=headers, timeout=15)
              soup = BeautifulSoup(res.content.decode("cp949", errors="ignore"), "html.parser")

              data_list = []
              for tr in soup.find_all("tr"):
                  tds = tr.find_all("td")
                  if len(tds) >= 9:
                      name_a = tds[1].find("a")
                      if not name_a:
                          continue
                      
                      name = name_a.text.strip()
                      if not name or any(k in name for k in ["TIGER", "KODEX", "ACE", "RISE", "레버리지", "인버스"]):
                          continue
                      
                      code = name_a['href'].split('code=')[-1]
                      cur_price = tds[2].text.strip()
                      rate = tds[4].text.strip()
                      
                      try:
                          total_vol = int(tds[5].text.replace(",", ""))
                          net_buy_vol = int(tds[6].text.replace(",", ""))
                          net_buy_amt = int(tds[7].text.replace(",", ""))
                      except:
                          continue

                      # 핵심 알파 지표: 거래량 점유율 (Volume Participation Rate)
                      # 당일 총 거래량 중 해당 주체가 잡아먹은 물량 비율
                      vpr = round((net_buy_vol / total_vol) * 100, 2) if total_vol > 0 else 0
                      
                      data_list.append({
                          "종목명": name,
                          "종목코드": code,
                          "현재가": cur_price,
                          "등락률": rate,
                          "총거래량": total_vol,
                          "순매수량": net_buy_vol,
                          "순매수대금(백만)": net_buy_amt,
                          "거래량점유율(VPR)": vpr
                      })
                      
                  if len(data_list) >= top_n:
                      break

              df = pd.DataFrame(data_list)
              if not df.empty:
                  # 거래대금이 아닌 '거래량 점유율(VPR)' 순으로 재정렬하여 시장 통제력 확인
                  df = df.sort_values(by="거래량점유율(VPR)", ascending=False).reset_index(drop=True)
              return df

          print("1. 사모펀드/연기금 당일 거래량 점유율(VPR) 퀀트 데이터 스크리닝 중...")
          df_pef_kospi = fetch_quant_deal_rank(1, 8000)
          df_pef_kosdaq = fetch_quant_deal_rank(2, 8000)
          df_pension_kospi = fetch_quant_deal_rank(1, 7000)
          df_pension_kosdaq = fetch_quant_deal_rank(2, 7000)

          # 최상위 통제력(VPR 상위) 3종목씩 압축
          pef_top = pd.concat([df_pef_kospi.head(3), df_pef_kosdaq.head(3)]).sort_values(by="거래량점유율(VPR)", ascending=False)
          pension_top = pd.concat([df_pension_kospi.head(3), df_pension_kosdaq.head(3)]).sort_values(by="거래량점유율(VPR)", ascending=False)

          today = datetime.datetime.now().strftime("%Y-%m-%d")

          # -------------------------------------------------------------
          # 2. Gemini AI 퀀트 프롬프트 (리딩방 금지, 객관적 지표 중심)
          # -------------------------------------------------------------
          prompt = f"""
          오늘({today}) 사모펀드(8000) 및 연기금(7000)의 '거래량 점유율(VPR)' 데이터다. 
          VPR(Volume Participation Rate)은 당일 총 거래량 중 해당 기관이 흡수한 순매수 물량의 비중(%)을 뜻한다. 높을수록 주가 통제력이 강하다.

          [사모펀드 VPR 최상위 종목]
          {pef_top.to_string(index=False)}

          [연기금 VPR 최상위 종목]
          {pension_top.to_string(index=False)}

          [★ 절대 엄수: 리포트 톤앤매너 ★]
          1. 리딩방 스타일의 단어(지지선, 저항선, 손절가, 목표가, 매수 타점, 경계령 등)를 **절대** 사용하지 마라.
          2. 철저하게 여의도 퀀트 리서치 데스크의 드라이(Dry)하고 팩트 중심적인 톤을 유지해라.
          3. 'VPR(수급 점유율)'과 '거래대금'이 겹치는 종목이 시장 미시구조(Microstructure) 측면에서 어떤 매물 장악력을 가졌는지 객관적 데이터로만 서술해라.
          4. 텔레그램 가독성을 위해 문단 사이 '빈 줄(줄바꿈 2번)'을 반드시 넣어라.
          5. <code>, ```, 마크다운 표(|---|), 마크다운 볼드(**) 절대 금지. 제목/소제목은 <b>텍스트</b>만 사용.

          [★ 출력 레이아웃 템플릿 ★]
          <b>📊 [{today}] 퀀트 수급 요약: 스마트머니 점유율(VPR) 분석</b>

          ━━━━━━━━━━━━━━━━━━━
          <b>1. 📌 당일 시장 미시구조 (Microstructure) 특징</b>

          • 사모펀드 및 연기금의 자금 쏠림과 호가창 점유율(VPR) 기반의 시장 팩트 요약 (2줄 이내)

          ━━━━━━━━━━━━━━━━━━━
          <b>2. 🎯 사모펀드 (Fast Money) 시장 통제력 상위</b>

          <b>■ 1. 종목명 (현재가 / 등락률)</b>
          • <b>수급 장악력:</b> 순매수대금 OOO백만 / 거래량 점유율(VPR) O.O%
          • <b>데이터 해석:</b> VPR 수치를 기반으로 한 사모펀드의 매물대 흡수 강도와 변동성 요약 (드라이한 팩트 1줄)

          <b>■ 2. 종목명 (현재가 / 등락률)</b>
          • <b>수급 장악력:</b> 순매수대금 OOO백만 / 거래량 점유율(VPR) O.O%
          • <b>데이터 해석:</b> VPR 수치를 기반으로 한 사모펀드의 매물대 흡수 강도와 변동성 요약 (드라이한 팩트 1줄)

          <b>■ 3. 종목명 (현재가 / 등락률)</b>
          • <b>수급 장악력:</b> 순매수대금 OOO백만 / 거래량 점유율(VPR) O.O%
          • <b>데이터 해석:</b> VPR 수치를 기반으로 한 사모펀드의 매물대 흡수 강도와 변동성 요약 (드라이한 팩트 1줄)

          ━━━━━━━━━━━━━━━━━━━
          <b>3. 🛡️ 연기금 (Slow Money) 매물 흡수 상위</b>

          <b>■ 1. 종목명 (현재가 / 등락률)</b>
          • <b>수급 장악력:</b> 순매수대금 OOO백만 / 거래량 점유율(VPR) O.O%
          • <b>데이터 해석:</b> VPR 수치를 기반으로 한 연기금의 중장기 물량 잠금(Lock-in) 특성 요약 (드라이한 팩트 1줄)

          <b>■ 2. 종목명 (현재가 / 등락률)</b>
          • <b>수급 장악력:</b> 순매수대금 OOO백만 / 거래량 점유율(VPR) O.O%
          • <b>데이터 해석:</b> VPR 수치를 기반으로 한 연기금의 중장기 물량 잠금(Lock-in) 특성 요약 (드라이한 팩트 1줄)

          <b>■ 3. 종목명 (현재가 / 등락률)</b>
          • <b>수급 장악력:</b> 순매수대금 OOO백만 / 거래량 점유율(VPR) O.O%
          • <b>데이터 해석:</b> VPR 수치를 기반으로 한 연기금의 중장기 물량 잠금(Lock-in) 특성 요약 (드라이한 팩트 1줄)

          ━━━━━━━━━━━━━━━━━━━
          <b>4. 💡 퀀트 데스크 요약 (Quant Summary)</b>

          • 통계적 이상치(아웃라이어)를 보인 종목이나 기관의 매수 강도(VPR)가 가격 상승률 대비 과도/과소하게 나타난 이상 현상 팩트 리포팅 (2줄 이내)
          """

          gemini_api_url = f"{HTTP_SCHEME}{GEMINI_DOMAIN}/v1beta/models/gemini-2.5-flash:generateContent"
          payload = {"contents": [{"parts": [{"text": prompt}]}]}

          report_text = None
          max_retries = 3

          for attempt in range(1, max_retries + 1):
              print(f"2. Gemini 퀀트 분석 중... (시도 {attempt}/{max_retries})")
              try:
                  g_res = requests.post(
                      gemini_api_url,
                      params={"key": gemini_key},
                      headers={"Content-Type": "application/json"},
                      data=json.dumps(payload),
                      timeout=90
                  )
                  if g_res.status_code == 200:
                      report_text = g_res.json()["candidates"][0]["content"]["parts"][0]["text"]
                      break
              except Exception as e:
                  pass
              time.sleep(3)

          if not report_text:
              print("❌ Gemini 리포트 생성 실패")
              sys.exit(1)

          report_text = report_text.replace("```html", "").replace("```", "").replace("<code>", "").replace("</code>", "").strip()

          # -------------------------------------------------------------
          # 3. 채널 발송
          # -------------------------------------------------------------
          print(f"3. {chat_id} 채널로 발송...")
          tg_send_url = f"{tg_base_url}/sendMessage"

          def send_to_telegram(msg_text):
              chunks = [msg_text[i:i+3800] for i in range(0, len(msg_text), 3800)] if len(msg_text) > 3800 else [msg_text]
              success = True

              for idx, chunk in enumerate(chunks):
                  res = requests.post(tg_send_url, json={
                      "chat_id": chat_id,
                      "text": chunk,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": True
                  }, timeout=15)

                  if res.status_code != 200:
                      plain_chunk = re.sub(r'<[^>]+>', '', chunk)
                      res_fallback = requests.post(tg_send_url, json={"chat_id": chat_id, "text": plain_chunk}, timeout=15)
                      if res_fallback.status_code != 200:
                          success = False
              return success

          if not send_to_telegram(report_text):
              sys.exit(1)

          print(f"🎉 퀀트 리포트 발송 완료!")
          EOF

          python run_agent.py
