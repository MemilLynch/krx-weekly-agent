name: Daily KRX Quant Agent

on:
  schedule:
    # 한국 시간(KST) 평일 16:10 자동 실행 (UTC 07:10)
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install requests beautifulsoup4 pandas

      - name: 기관 수급 분석 및 채널 발송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > run_agent.py
          import os
          import sys
          import time
          import json
          import datetime
          import re
          import requests
          from bs4 import BeautifulSoup
          import pandas as pd

          # -------------------------------------------------------------
          # 0. 전송 대상 채널 설정 (@MemilLynch)
          # -------------------------------------------------------------
          TARGET_CHANNEL = "@MemilLynch"

          raw_gemini_key = os.getenv("GEMINI_API_KEY", "")
          raw_bot_token = os.getenv("TELEGRAM_BOT_TOKEN", "")
          raw_chat_id = os.getenv("TELEGRAM_CHAT_ID", "")

          gemini_key = raw_gemini_key.strip().strip("'").strip('"')
          bot_token = raw_bot_token.strip().strip("'").strip('"')
          chat_id = TARGET_CHANNEL if TARGET_CHANNEL else raw_chat_id.strip().strip("'").strip('"')

          if bot_token.lower().startswith("bot"):
              bot_token = bot_token[3:]

          if not gemini_key or not bot_token:
              print("❌ 환경변수 오류: GEMINI_API_KEY 또는 TELEGRAM_BOT_TOKEN이 누락되었습니다.")
              sys.exit(1)

          HTTP_SCHEME = "https://"
          NAVER_DOMAIN = "finance.naver.com"
          GEMINI_DOMAIN = "generativelanguage.googleapis.com"
          TG_DOMAIN = "api.telegram.org"
          tg_base_url = f"{HTTP_SCHEME}{TG_DOMAIN}/bot{bot_token}"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Referer": f"{HTTP_SCHEME}{NAVER_DOMAIN}/"
          }

          # -------------------------------------------------------------
          # 1. 상장주식수 조회 함수
          # -------------------------------------------------------------
          def fetch_total_shares(code):
              try:
                  url = f"{HTTP_SCHEME}{NAVER_DOMAIN}/item/main.naver?code={code}"
                  res = requests.get(url, headers=headers, timeout=10)
                  soup = BeautifulSoup(res.content.decode("cp949", errors="ignore"), "html.parser")
                  for tr in soup.find_all("tr"):
                      th = tr.find("th")
                      if th and "상장주식수" in th.get_text():
                          td = tr.find("td")
                          if td:
                              clean_num = re.sub(r'[^\d]', '', td.get_text())
                              if clean_num:
                                  return int(clean_num)
              except Exception:
                  pass
              return 0

          # -------------------------------------------------------------
          # 2. 사모펀드/연기금 수급 데이터 및 공식 지표 연산
          # -------------------------------------------------------------
          def fetch_institutional_data(mkt_gb, investor_gubun, top_n=10):
              url = f"{HTTP_SCHEME}{NAVER_DOMAIN}/sise/sise_deal_rank_iframe.naver?investor_gubun={investor_gubun}&type=buy&mkt_gb={mkt_gb}"
              res = requests.get(url, headers=headers, timeout=15)
              soup = BeautifulSoup(res.content.decode("cp949", errors="ignore"), "html.parser")

              data_list = []
              for tr in soup.find_all("tr"):
                  tds = tr.find_all("td")
                  if len(tds) < 8:
                      continue

                  a_tag = tr.find("a", href=re.compile(r'code=\d{6}'))
                  if not a_tag:
                      continue

                  name = a_tag.get_text(strip=True)
                  if not name or any(k in name for k in ["TIGER", "KODEX", "ACE", "RISE", "SOL", "PLUS", "KBSTAR", "KOSEF", "스팩", "레버리지", "인버스"]):
                      continue

                  code_match = re.search(r'code=(\d{6})', a_tag['href'])
                  if not code_match:
                      continue
                  code = code_match.group(1)

                  try:
                      cur_price = tds[2].get_text(strip=True)
                      rate = tds[4].get_text(strip=True)
                      total_vol = int(tds[5].get_text(strip=True).replace(",", ""))
                      net_vol = int(tds[6].get_text(strip=True).replace(",", ""))
                      raw_amt_백만 = int(tds[7].get_text(strip=True).replace(",", ""))
                      
                      # 백만원 -> 억원 변환
                      amt_억 = round(raw_amt_백만 / 100, 1)

                      # 당일 총 거래량 대비 순매수 비중 (%)
                      volume_ratio = round((net_vol / total_vol) * 100, 2) if total_vol > 0 else 0.0

                      # 상장주식수 대비 지분율 (%)
                      total_shares = fetch_total_shares(code)
                      share_ratio = round((net_vol / total_shares) * 100, 3) if total_shares > 0 else 0.0

                      data_list.append({
                          "종목명": name,
                          "종목코드": code,
                          "현재가": f"{cur_price}원",
                          "등락률": rate,
                          "순매수대금": f"{amt_억:,}억",
                          "총거래량": f"{total_vol:,}주",
                          "순매수량": f"{net_vol:,}주",
                          "거래량대비순매수비중": volume_ratio,
                          "상장주식수대비비중": f"{share_ratio:.3f}%"
                      })
                  except Exception:
                      continue

                  if len(data_list) >= top_n:
                      break

              return pd.DataFrame(data_list)

          print("1. 네이버 금융에서 사모펀드 / 연기금 수급 원천 데이터 수집 중...")
          # 8000: 사모펀드, 7000: 연기금 | 1: 코스피, 2: 코스닥
          df_pef_kospi = fetch_institutional_data(1, 8000, top_n=6)
          df_pef_kosdaq = fetch_institutional_data(2, 8000, top_n=6)
          df_pension_kospi = fetch_institutional_data(1, 7000, top_n=6)
          df_pension_kosdaq = fetch_institutional_data(2, 7000, top_n=6)

          pef_combined = pd.concat([df_pef_kospi, df_pef_kosdaq], ignore_index=True)
          pension_combined = pd.concat([df_pension_kospi, df_pension_kosdaq], ignore_index=True)

          # 거래량 대비 순매수 비중 기준 상위 3종목 선별
          pef_top = pef_combined.sort_values(by="거래량대비순매수비중", ascending=False).head(3).reset_index(drop=True) if not pef_combined.empty else pd.DataFrame()
          pension_top = pension_combined.sort_values(by="거래량대비순매수비중", ascending=False).head(3).reset_index(drop=True) if not pension_combined.empty else pd.DataFrame()

          today = datetime.datetime.now().strftime("%Y-%m-%d")
          print(f"✅ 수집 완료: 사모펀드 {len(pef_top)}종목, 연기금 {len(pension_top)}종목")

          # -------------------------------------------------------------
          # 3. Gemini AI 퀀트 리서치 브리핑 생성
          # -------------------------------------------------------------
          prompt = f"""
          오늘({today}) 국내 증시 사모펀드 및 연기금 수급 집계 데이터다.
          - 거래량 대비 순매수 비중: 당일 발생한 총 거래량 중 해당 기관이 순매수한 수량의 비율(%). 당일 유통 거래 중 해당 주체의 매수 장악력을 나타냄.
          - 상장주식수 대비 비중: 전체 상장주식수 대비 당일 순매수한 주식의 비율(%).

          [사모펀드 거래량 비중 상위 3종목]
          {pef_top.to_string(index=False) if not pef_top.empty else "집계 데이터 없음"}

          [연기금 거래량 비중 상위 3종목]
          {pension_top.to_string(index=False) if not pension_top.empty else "집계 데이터 없음"}

          [★ 톤앤매너 및 작성 원칙 ★]
          1. 억지스러운 영문 약어(VPR, POV 등)는 일체 사용하지 마라.
          2. 리딩방 스타일(지지선, 저항선, 손절가, 목표가, 추천, 진입 타점 등)의 표현을 엄격히 금지한다.
          3. 증권사 퀀트 리서치 데스크의 객관적이고 드라이(Dry)한 어조로 수치와 거래 팩트만 서술해라.
          4. 텔레그램 모바일 가독성을 위해 각 섹션 및 각 종목(■ 1., ■ 2., ■ 3.) 사이사이에 반드시 '빈 줄(줄바꿈 2번)'을 유지해라.
          5. <code> 태그, 백틱(```), 마크다운 표(|---|), 마크다운 볼드(**) 절대 금지. 제목 및 강조는 <b>텍스트</b> 태그만 사용.
          6. 단독 < 또는 > 기호는 절대 쓰지 마라. (텔레그램 HTML 오류 방지)

          [★ 출력 레이아웃 템플릿 ★]
          <b>📊 [{today}] 사모펀드·연기금 수급 분석 브리핑</b>

          ━━━━━━━━━━━━━━━━━━━
          <b>1. 📌 당일 기관 수급 동향</b>

          • 사모펀드 및 연기금의 총 거래량 대비 순매수 집중도와 수급 특이사항 요약 (2줄 이내)

          ━━━━━━━━━━━━━━━━━━━
          <b>2. 🎯 사모펀드 순매수 비중 상위</b>

          <b>■ 1. 종목명 (현재가 / 등락률)</b>
          • <b>수급 지표:</b> 순매수 OOO억 / 거래량 대비 O.O% / 상장주식수 대비 O.OO%
          • <b>거래
