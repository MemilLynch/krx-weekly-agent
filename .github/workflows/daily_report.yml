name: Daily KRX AI Agent

on:
  schedule:
    # 한국 시간(KST) 평일 16:10 자동 실행 (UTC 07:10)
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install requests pandas

      - name: 수급 데이터 수집 및 텔레그램 발송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > run_agent.py
          import os
          import sys
          import json
          import re
          import datetime
          import requests
          import pandas as pd

          gemini_key = os.getenv("GEMINI_API_KEY")
          bot_token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")

          if not all([gemini_key, bot_token, chat_id]):
              print("환경변수 오류: GitHub Secrets 3종을 확인하세요.")
              sys.exit(1)

          # 1. 네이버 금융 데이터 수신
          print("1. 네이버 금융 외국인 순매수 실데이터 수집 시작...")
          url = "https://finance.naver.com/sise/sise_deal_rank_iframe.naver?investor_gubun=9000&type=buy&mkt_gb=1"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Referer": "https://finance.naver.com/"
          }

          res = requests.get(url, headers=headers, timeout=15)
          html_text = res.content.decode("cp949", errors="ignore")

          # 닫는 태그(</tr>) 부재 문제 원천 해결: '<tr' 단위로 직접 청크 분할
          tr_chunks = re.split(r'<tr', html_text, flags=re.IGNORECASE)
          data_list = []

          for chunk in tr_chunks:
              code_match = re.search(r'code=(\d{6})', chunk, flags=re.IGNORECASE)
              name_match = re.search(r'>([^<]+)</a>', chunk)
              
              if not (code_match and name_match):
                  continue

              code = code_match.group(1)
              name = name_match.group(1).strip()
              if not name:
                  continue

              # '<td' 단위로 분할하여 텍스트 값만 정제
              td_chunks = re.split(r'<td', chunk, flags=re.IGNORECASE)[1:]
              tds = [re.sub(r'<[^>]+>', '', td).replace('&nbsp;', ' ').strip() for td in td_chunks]

              # 테이블 컬럼 매핑: [0:순위, 1:종목명, 2:현재가, 3:전일비, 4:등락률, 5:매수량, 6:순매수대금(백만원)]
              if len(tds) >= 6:
                  cur_price = tds[2] if len(tds) > 2 else "-"
                  rate = tds[4] if len(tds) > 4 else "-"
                  volume = tds[5] if len(tds) > 5 else "-"
                  raw_amt = tds[6] if len(tds) > 6 else "-"

                  # 백만원 -> 억원 환산
                  num_only = re.sub(r'[^\d.]', '', raw_amt)
                  if num_only:
                      try:
                          amt_100m = f"{round(float(num_only) / 100, 1):,}억"
                      except Exception:
                          amt_100m = raw_amt
                  else:
                      amt_100m = raw_amt

                  data_list.append({
                      "순위": len(data_list) + 1,
                      "종목명": name,
                      "종목코드": code,
                      "현재가": cur_price,
                      "등락률": rate,
                      "순매수거래량": volume,
                      "순매수대금": amt_100m
                  })

                  if len(data_list) >= 20:
                      break

          if not data_list:
              print(f"데이터 파싱 실패: 수신 바이트({len(html_text)})")
              sys.exit(1)

          df = pd.DataFrame(data_list)
          data_str = df.to_string(index=False)
          today = datetime.datetime.now().strftime("%Y-%m-%d")
          print(f"수집 성공: 상위 {len(df)}개 종목 파싱 완료!")

          # 2. Gemini AI 수급 리포트 생성
          print("2. Gemini AI 수급 분석 리포트 생성 중...")
          prompt = f"""
          아래는 오늘({today}) 기준 코스피(KOSPI) 외국인 순매수 상위 20개 종목 공식 데이터다:
          {data_str}

          위 데이터를 바탕으로 다음 형식에 맞춰 투자 보고서를 작성해라:
          1. 순매수 상위 1위~10위 종목 테이블 (순위, 종목명, 순매수대금, 순매수거래량, 등락률)
          2. 순매수 상위 TOP 3 섹터 및 핵심 수급 특징 요약 (실제 데이터에 기반할 것)
          """

          g_url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={gemini_key}"
          payload = {"contents": [{"parts": [{"text": prompt}]}]}
          g_res = requests.post(g_url, headers={"Content-Type": "application/json"}, data=json.dumps(payload))

          if g_res.status_code != 200:
              print(f"Gemini API 에러: {g_res.text}")
              sys.exit(1)

          report_content = g_res.json()["candidates"][0]["content"]["parts"][0]["text"]
          report_text = f"📊 [{today}] 코스피 외국인 수급 리포트\n\n" + report_content

          # 3. 텔레그램 발송
          print("3. 텔레그램 메시지 발송 중...")
          tg_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          t_res = requests.post(tg_url, data={"chat_id": chat_id, "text": report_text})

          if t_res.status_code == 200:
              print("🎉 텔레그램 발송 성공 완료!")
          else:
              print(f"텔레그램 발송 실패: {t_res.text}")
              sys.exit(1)
          EOF

          python run_agent.py
