name: Daily KRX Quant Agent

on:
  schedule:
    # 한국 시간(KST) 평일 16:10 자동 실행 (UTC 07:10)
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: KRX 공식 데이터 및 필수 라이브러리 설치
        run: pip install pykrx requests beautifulsoup4 pandas

      - name: KRX 원천데이터 퀀트 분석 및 채널 발송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > run_agent.py
          import os
          import sys
          import time
          import json
          import datetime
          import re
          import requests
          import pandas as pd
          from pykrx import stock

          # -------------------------------------------------------------
          # 0. 전송 대상 채널 및 환경변수 정제
          # -------------------------------------------------------------
          TARGET_CHANNEL = "@MemilLynch"

          raw_gemini_key = os.getenv("GEMINI_API_KEY", "")
          raw_bot_token = os.getenv("TELEGRAM_BOT_TOKEN", "")
          raw_chat_id = os.getenv("TELEGRAM_CHAT_ID", "")

          gemini_key = raw_gemini_key.strip().strip("'").strip('"')
          bot_token = raw_bot_token.strip().strip("'").strip('"')
          chat_id = TARGET_CHANNEL if TARGET_CHANNEL else raw_chat_id.strip().strip("'").strip('"')

          if bot_token.lower().startswith("bot"):
              bot_token = bot_token[3:]

          if not gemini_key or not bot_token:
              print("❌ 환경변수 오류: GEMINI_API_KEY 또는 TELEGRAM_BOT_TOKEN이 누락되었습니다.")
              sys.exit(1)

          HTTP_SCHEME = "https://"
          GEMINI_DOMAIN = "generativelanguage.googleapis.com"
          TG_DOMAIN = "api.telegram.org"
          tg_base_url = f"{HTTP_SCHEME}{TG_DOMAIN}/bot{bot_token}"

          # -------------------------------------------------------------
          # 1. 가장 최신의 유효 거래일 탐색 (주말/공휴일/장마감 전후 자동 보정)
          # -------------------------------------------------------------
          print("1. KRX 공식 서버에서 최신 거래일 조회 중...")
          now = datetime.datetime.now()
          target_date = None

          for i in range(10):
              check_date = (now - datetime.timedelta(days=i)).strftime("%Y%m%d")
              try:
                  test_df = stock.get_market_ohlcv(check_date, market="KOSPI")
                  if not test_df.empty and test_df['거래량'].sum() > 0:
                      target_date = check_date
                      break
              except Exception:
                  continue

          if not target_date:
              target_date = now.strftime("%Y%m%d")

          formatted_date = f"{target_date[:4]}-{target_date[4:6]}-{target_date[6:]}"
          print(f"✅ 기준 거래일자: {formatted_date}")

          # -------------------------------------------------------------
          # 2. KRX 공식 로우데이터 수집 (사모펀드, 연기금, 시세, 상장주식수)
          # -------------------------------------------------------------
          print("2. 사모펀드 / 연기금 순매수 및 시장 원천 데이터 수집 중...")
          try:
              df_pef = stock.get_market_net_purchases_of_equities_by_ticker(target_date, target_date, "ALL", "사모")
              df_pension = stock.get_market_net_purchases_of_equities_by_ticker(target_date, target_date, "ALL", "연기금")
              df_ohlcv = stock.get_market_ohlcv(target_date, market="ALL")
              df_cap = stock.get_market_cap(target_date, market="ALL")
          except Exception as e:
              print(f"❌ KRX 데이터 수집 실패: {e}")
              sys.exit(1)

          def extract_quant_vpr(df_investor, min_amt_억=2.0, top_n=3):
              if df_investor.empty or df_ohlcv.empty or df_cap.empty:
                  return pd.DataFrame()

              merged = df_investor.join(df_ohlcv[['종가', '등락률', '거래량']], how='inner')
              merged = merged.join(df_cap[['상장주식수']], how='inner')

              # 최소 순매수 대금 필터링 (노이즈 제거)
              merged = merged[merged['순매수대금'] >= (min_amt_억 * 100_000_000)].copy()

              records = []
              for ticker, row in merged.iterrows():
                  name = stock.get_market_ticker_name(ticker)
                  if any(k in name for k in ["TIGER", "KODEX", "ACE", "RISE", "SOL", "PLUS", "KBSTAR", "KOSEF", "스팩", "레버리지", "인버스"]):
                      continue

                  total_vol = int(row['거래량'])
                  net_vol = int(row['순매수거래량'])
                  total_shares = int(row['상장주식수'])
                  close_price = int(row['종가'])
                  rate = float(row['등락률'])
                  net_amt_억 = round(row['순매수대금'] / 100_000_000, 1)

                  vpr = round((net_vol / total_vol) * 100, 2) if total_vol > 0 else 0.0
                  penetration = round((net_vol / total_shares) * 100, 3) if total_shares > 0 else 0.0

                  records.append({
                      "종목명": name,
                      "종목코드": ticker,
                      "현재가": f"{close_price:,}원",
                      "등락률": f"{rate:+.2f}%",
                      "순매수대금": f"{net_amt_억:,}억",
                      "총거래량": f"{total_vol:,}주",
                      "순매수량": f"{net_vol:,}주",
                      "VPR": vpr,
                      "지분침투율": f"{penetration:.3f}%"
                  })

              res_df = pd.DataFrame(records)
              if not res_df.empty:
                  res_df = res_df.sort_values(by="VPR", ascending=False).head(top_n).reset_index(drop=True)
              return res_df

          df_pef_top = extract_quant_vpr(df_pef, min_amt_억=2.0, top_n=3)
          df_pension_top = extract_quant_vpr(df_pension, min_amt_억=3.0, top_n=3)

          print("3. Gemini AI 퀀트 리서치 생성 중...")

          # -------------------------------------------------------------
          # 3. Gemini AI 퀀트 리포트 생성 (gemini-3.6-flash)
          # -------------------------------------------------------------
          prompt = f"""
          기준 거래일자: [{formatted_date}]
          KRX(한국거래소) 공식 집계 기반 사모펀드 및 연기금의 거래량 점유율(VPR) 퀀트 데이터다.
          - VPR(Volume Participation Rate): 당일 총거래량 중 해당 주체의 순매수 비중(%). 수치가 높을수록 호가창 유통 물량 장악력이 큼.
          - 지분침투율: 상장주식 총수 대비 당일 순매수 주식수 비율(%).

          [사모펀드 VPR 최상위 종목]
          {df_pef_top.to_string(index=False) if not df_pef_top.empty else "집계 기준 만족 종목 없음"}

          [연기금 VPR 최상위 종목]
          {df_pension_top.to_string(index=False) if not df_pension_top.empty else "집계 기준 만족 종목 없음"}

          [★ 작성 규칙 - 절대 엄수 ★]
          1. 리딩방 스타일(지지선, 저항선, 손절가, 목표가, 추천 등) 어휘 일체 사용 금지.
          2. 증권사 퀀트 리서치 센터 톤으로 철저히 데이터, VPR 수치, 지분침투율 팩트만 드라이하게 기술할 것.
          3. 모바일 가독성을 위해 각 섹션 및 각 종목(■ 1., ■ 2., ■ 3.) 사이사이에 반드시 '빈 줄(줄바꿈 2번)'을 넣을 것.
          4. <code>, ```, 마크다운 표(|---|), 마크다운 볼드(**) 절대 금지. 제목/소제목은 <b>텍스트</b> 태그만 사용.
          5. 단독 < 또는 > 기호 절대 사용 금지.

          [★ 반드시 아래 템플릿 서식을 그대로 출력할 것 ★]
          <b>📊 [{formatted_date}] 퀀트 수급 브리핑: 스마트머니 VPR 분석</b>

          ━━━━━━━━━━━━━━━━━━━
          <b>1. 📌 당일 시장 미시구조 (Microstructure)</b>

          • 사모펀드(단기 유동성 흡수) 및 연기금(중기 물량 잠금)의 총거래량 대비 순매수 집중도 팩트 요약 (2줄 이내)

          ━━━━━━━━━━━━━━━━━━━
          <b>2. 🎯 사모펀드 (Fast Money) 거래량 장악 상위</b>

          <b>■ 1. 종목명 (현재가 / 등락률)</b>
          • <b>수급 데이터:</b> 순매수 OOO억 / VPR O.O% / 지분침투율 O.OO%
          • <b>데이터 진단:</b> VPR 수치 기반의 단기 유통 물량 흡수 강도 팩트 요약 (1줄)

          <b>■ 2. 종목명 (현재가 / 등락률)</b>
          • <b>수급 데이터:</b> 순매수 OOO억 / VPR O.O% / 지분침투율 O.OO%
          • <b>데이터 진단:</b> VPR 수치 기반의 단기 유통 물량 흡수 강도 팩트 요약 (1줄)

          <b>■ 3. 종목명 (현재가 / 등락률)</b>
          • <b>수급 데이터:</b> 순매수 OOO억 / VPR O.O% / 지분침투율 O.OO%
          • <b>데이터 진단:</b> VPR 수치 기반의 단기 유통 물량 흡수 강도 팩트 요약 (1줄)

          ━━━━━━━━━━━━━━━━━━━
          <b>3. 🛡️ 연기금 (Slow Money) 매물 잠금 상위</b>

          <b>■ 1. 종목명 (현재가 / 등락률)</b>
          • <b>수급 데이터:</b> 순매수 OOO억 / VPR O.O% / 지분침투율 O.OO%
          • <b>데이터 진단:</b> VPR 수치 기반의 중기 매물 흡수 및 자금 성격 요약 (1줄)

          <b>■ 2. 종목명 (현재가 / 등락률)</b>
          • <b>수급 데이터:</b> 순매수 OOO억 / VPR O.O% / 지분침투율 O.OO%
          • <b>데이터 진단:</b> VPR 수치 기반의 중기 매물 흡수 및 자금 성격 요약 (1줄)

          <b>■ 3. 종목명 (현재가 / 등락률)</b>
          • <b>수급 데이터:</b> 순매수 OOO억 / VPR O.O% / 지분침투율 O.OO%
          • <b>데이터 진단:</b> VPR 수치 기반의 중기 매물 흡수 및 자금 성격 요약 (1줄)

          ━━━━━━━━━━━━━━━━━━━
          <b>4. 💡 퀀트 데스크 특이사항 (Quant Notes)</b>

          • 총거래량 대비 기관 순매수 비중(VPR)이 비정상적으로 높게 형성된 종목군 및 수급 쏠림 현상 정리 (2줄 이내)
          """

          gemini_api_url = f"{HTTP_SCHEME}{GEMINI_DOMAIN}/v1beta/models/gemini-3.6-flash:generateContent"
          payload = {"contents": [{"parts": [{"text": prompt}]}]}

          report_text = None
          max_retries = 3

          for attempt in range(1, max_retries + 1):
              print(f"Gemini API 요청 중... (시도 {attempt}/{max_retries})")
              try:
                  g_res = requests.post(
                      gemini_api_url,
                      params={"key": gemini_key},
                      headers={"Content-Type": "application/json"},
                      data=json.dumps(payload),
                      timeout=90
                  )
                  if g_res.status_code == 200:
                      report_text = g_res.json()["candidates"][0]["content"]["parts"][0]["text"]
                      break
                  else:
                      print(f"Gemini API 에러 ({g_res.status_code}): {g_res.text}")
              except Exception as e:
                  print(f"Gemini 호출 오류: {e}")
              time.sleep(3)

          if not report_text:
              print("❌ Gemini 리포트 생성 실패")
              sys.exit(1)

          # -------------------------------------------------------------
          # 4. 서식 및 줄바꿈 강제 보정 후 @MemilLynch 발송
          # -------------------------------------------------------------
          report_text = report_text.replace("```html", "").replace("```", "").replace("<code>", "").replace("</code>", "").strip()
          
          # 모바일 줄바꿈 강제 정렬
          report_text = re.sub(r'(━━━━━━━━━━━━━━━━━━━)(\s*)([1-4]\.)', r'\1\n\n<b>\3', report_text)
          report_text = re.sub(r'([^\n])(\s*)(■ \d\.)', r'\1\n\n\3', report_text)

          print(f"4. {chat_id} 채널로 메시지 발송 시작...")
          tg_send_url = f"{tg_base_url}/sendMessage"

          def send_to_telegram(msg_text):
              chunks = [msg_text[i:i+3800] for i in range(0, len(msg_text), 3800)] if len(msg_text) > 3800 else [msg_text]
              success = True

              for idx, chunk in enumerate(chunks):
                  res = requests.post(tg_send_url, json={
                      "chat_id": chat_id,
                      "text": chunk,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": True
                  }, timeout=15)

                  if res.status_code == 200:
                      print(f"[{idx+1}/{len(chunks)}] ✅ 채널 발송 성공!")
                  else:
                      print(f"[{idx+1}/{len(chunks)}] HTML 모드 실패 -> 일반 텍스트 재전송...")
                      plain_chunk = re.sub(r'<[^>]+>', '', chunk)
                      res_fallback = requests.post(tg_send_url, json={
                          "chat_id": chat_id,
                          "text": plain_chunk,
                          "disable_web_page_preview": True
                      }, timeout=15)
                      if res_fallback.status_code != 200:
                          success = False
              return success

          if not send_to_telegram(report_text):
              print("❌ 에러: 채널 발송 실패")
              sys.exit(1)

          print("🎉 KRX 원천데이터 기반 퀀트 리포트 발송 완료!")
          EOF

          python run_agent.py
