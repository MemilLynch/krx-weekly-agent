name: Daily KRX Quant Agent

on:
  schedule:
    # 한국 시간(KST) 평일 16:10 자동 실행 (UTC 07:10)
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install requests beautifulsoup4 pandas

      - name: 메이저 수급 분석 및 텔레그램 무음 발송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > run_agent.py
          import os
          import sys
          import time
          import json
          import datetime
          import re
          import requests
          from bs4 import BeautifulSoup
          import pandas as pd

          # -------------------------------------------------------------
          # 0. 환경변수 검증
          # -------------------------------------------------------------
          raw_gemini_key = os.getenv("GEMINI_API_KEY", "")
          raw_bot_token = os.getenv("TELEGRAM_BOT_TOKEN", "")
          raw_chat_id = os.getenv("TELEGRAM_CHAT_ID", "")

          gemini_key = raw_gemini_key.strip().strip("'").strip('"')
          bot_token = raw_bot_token.strip().strip("'").strip('"')
          chat_id = raw_chat_id.strip().strip("'").strip('"')

          if bot_token.lower().startswith("bot"):
              bot_token = bot_token[3:]

          if not gemini_key or not bot_token or not chat_id:
              print("❌ 환경변수 오류: GitHub Secrets(GEMINI_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)를 확인하세요.")
              sys.exit(1)

          HTTP_SCHEME = "https://"
          NAVER_DOMAIN = "finance.naver.com"
          GEMINI_DOMAIN = "generativelanguage.googleapis.com"
          TG_DOMAIN = "api.telegram.org"
          tg_base_url = f"{HTTP_SCHEME}{TG_DOMAIN}/bot{bot_token}"

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Referer": f"{HTTP_SCHEME}{NAVER_DOMAIN}/"
          }

          # -------------------------------------------------------------
          # 1. 상장주식수 조회
          # -------------------------------------------------------------
          def fetch_total_shares(code):
              try:
                  url = f"{HTTP_SCHEME}{NAVER_DOMAIN}/item/main.naver?code={code}"
                  res = requests.get(url, headers=headers, timeout=10)
                  soup = BeautifulSoup(res.content.decode("cp949", errors="ignore"), "html.parser")
                  for tr in soup.find_all("tr"):
                      th = tr.find("th")
                      if th and "상장주식수" in th.get_text():
                          td = tr.find("td")
                          if td:
                              clean_num = re.sub(r'[^\d]', '', td.get_text())
                              if clean_num:
                                  return int(clean_num)
              except Exception:
                  pass
              return 0

          # -------------------------------------------------------------
          # 2. 외국인/기관 순매수 수집 및 거래량 비중 연산
          # -------------------------------------------------------------
          def fetch_market_rank(mkt_gb, investor_gubun, top_n=15):
              url = f"{HTTP_SCHEME}{NAVER_DOMAIN}/sise/sise_deal_rank_iframe.naver?investor_gubun={investor_gubun}&type=buy&mkt_gb={mkt_gb}"
              res = requests.get(url, headers=headers, timeout=15)
              soup = BeautifulSoup(res.content.decode("cp949", errors="ignore"), "html.parser")

              data_list = []
              for tr in soup.find_all("tr"):
                  tds = tr.find_all("td")
                  if len(tds) < 8:
                      continue

                  a_tag = tr.find("a", href=re.compile(r'code=\d{6}'))
                  if not a_tag:
                      continue

                  name = a_tag.get_text(strip=True)
                  if not name or any(k in name for k in ["TIGER", "KODEX", "ACE", "RISE", "SOL", "PLUS", "KBSTAR", "KOSEF", "스팩", "레버리지", "인버스"]):
                      continue

                  code_match = re.search(r'code=(\d{6})', a_tag['href'])
                  if not code_match:
                      continue
                  code = code_match.group(1)

                  try:
                      cur_price = tds[2].get_text(strip=True).replace(",", "")
                      rate = tds[4].get_text(strip=True)
                      total_vol = int(tds[5].get_text(strip=True).replace(",", ""))
                      net_vol = int(tds[6].get_text(strip=True).replace(",", ""))
                      raw_amt_백만 = int(tds[7].get_text(strip=True).replace(",", ""))

                      amt_억 = round(raw_amt_백만 / 100, 1)
                      vol_ratio = round((net_vol / total_vol) * 100, 2) if total_vol > 0 else 0.0

                      total_shares = fetch_total_shares(code)
                      share_ratio = round((net_vol / total_shares) * 100, 3) if total_shares > 0 else 0.0

                      data_list.append({
                          "종목명": name,
                          "종목코드": code,
                          "현재가": f"{int(cur_price):,}원",
                          "등락률": rate,
                          "순매수대금": f"{amt_억:,}억",
                          "순매수대금_숫자": amt_억,
                          "총거래량": f"{total_vol:,}주",
                          "순매수량": f"{net_vol:,}주",
                          "순매수량_숫자": net_vol,
                          "거래량대비순매수비중": vol_ratio,
                          "상장주식수대비비중": f"{share_ratio:.3f}%"
                      })
                  except Exception:
                      continue

                  if len(data_list) >= top_n:
                      break

              return pd.DataFrame(data_list)

          print("1. 네이버 금융에서 외국인/기관 수급 데이터 수집 중...")
          df_frgn_kospi = fetch_market_rank(1, 9000, top_n=12)
          df_frgn_kosdaq = fetch_market_rank(2, 9000, top_n=12)
          df_inst_kospi = fetch_market_rank(1, 1000, top_n=12)
          df_inst_kosdaq = fetch_market_rank(2, 1000, top_n=12)

          df_frgn_all = pd.concat([df_frgn_kospi, df_frgn_kosdaq], ignore_index=True)
          df_inst_all = pd.concat([df_inst_kospi, df_inst_kosdaq], ignore_index=True)

          df_frgn_top = df_frgn_all.sort_values(by="거래량대비순매수비중", ascending=False).head(3).reset_index(drop=True)
          df_inst_top = df_inst_all.sort_values(by="거래량대비순매수비중", ascending=False).head(3).reset_index(drop=True)

          df_dual = pd.DataFrame()
          if not df_frgn_all.empty and not df_inst_all.empty:
              merged = pd.merge(
                  df_frgn_all[['종목명', '종목코드', '현재가', '등락률', '순매수대금', '순매수대금_숫자', '거래량대비순매수비중']],
                  df_inst_all[['종목코드', '순매수대금', '순매수대금_숫자', '거래량대비순매수비중']],
                  on='종목코드',
                  suffixes=('_외국인', '_기관')
              )
              if not merged.empty:
                  merged['합산순매수대금'] = merged['순매수대금_숫자_외국인'] + merged['순매수대금_숫자_기관']
                  merged['합산거래량비중'] = (merged['거래량대비순매수비중_외국인'] + merged['거래량대비순매수비중_기관']).round(2)
                  df_dual = merged.sort_values(by='합산순매수대금', ascending=False).head(2).reset_index(drop=True)

          today = datetime.datetime.now().strftime("%Y-%m-%d")
          print(f"✅ 수집 완료: 외국인 {len(df_frgn_top)}건, 기관 {len(df_inst_top)}건, 쌍끌이 {len(df_dual)}건")

          # -------------------------------------------------------------
          # 3. Gemini AI 팩트 기반 퀀트 브리핑 생성
          # -------------------------------------------------------------
          prompt = f"""
          오늘({today}) 국내 증시 외국인 및 기관 공식 수급 집계 데이터다.
          - 거래량 대비 순매수 비중: 당일 총 거래량 중 해당 주체가 순매수한 수량의 비율(%).
          - 상장주식수 대비 비중: 전체 상장주식수 대비 당일 순매수한 주식의 비율(%).

          [외국인 거래량 비중 상위 3종목]
          {df_frgn_top[['종목명', '현재가', '등락률', '순매수대금', '거래량대비순매수비중', '상장주식수대비비중']].to_string(index=False)}

          [기관 거래량 비중 상위 3종목]
          {df_inst_top[['종목명', '현재가', '등락률', '순매수대금', '거래량대비순매수비중', '상장주식수대비비중']].to_string(index=False)}

          [외인·기관 동시 순매수(쌍끌이) 종목]
          {df_dual[['종목명', '현재가', '등락률', '순매수대금_외국인', '순매수대금_기관', '합산순매수대금', '합산거래량비중']].to_string(index=False) if not df_dual.empty else "당일 양대 주체 동시 상위 매집 종목 없음"}

          [★ 작성 원칙 및 서식 ★]
          1. 임의의 억지 약어(VPR 등) 절대 사용 금지.
          2. 리딩방 스타일(지지선, 저항선, 손절가, 목표가, 추천, 진입 타점 등) 표현 일체 금지.
          3. 증권사 퀀트 리서치 데스크의 객관적이고 드라이(Dry)한 어조로 수치와 거래 팩트만 서술할 것.
          4. 텔레그램 모바일 가독성을 위해 각 섹션 및 각 종목(■ 1., ■ 2., ■ 3.) 사이사이에 반드시 '빈 줄(줄바꿈 2번)'을 넣을 것.
          5. <code>, ```, 마크다운 표(|---|), 마크다운 볼드(**) 절대 금지. 제목 및 강조는 <b>텍스트</b> 태그만 사용.
          6. 단독 < 또는 > 기호는 절대 쓰지 말 것. (텔레그램 HTML 오류 방지)

          [★ 출력 레이아웃 템플릿 ★]
          <b>📊 [{today}] 외국인·기관 수급 분석 브리핑</b>

          ━━━━━━━━━━━━━━━━━━━
          <b>1. 📌 당일 시장 수급 동향</b>

          • 외국인 및 기관의 총 거래량 대비 순매수 집중도와 시장 수급 특이사항 요약 (2줄 이내)

          ━━━━━━━━━━━━━━━━━━━
          <b>2. 🎯 외국인 순매수 비중 상위</b>

          <b>■ 1. 종목명 (현재가 / 등락률)</b>
          • <b>수급 지표:</b> 순매수 OOO억 / 거래량 대비 O.O% / 상장주식수 대비 O.OO%
          • <b>거래 분석:</b> 당일 총 거래량 대비 순매수 비중 및 유통물량 흡수 특성 (객관적 팩트 1줄)

          <b>■ 2. 종목명 (현재가 / 등락률)</b>
          • <b>수급 지표:</b> 순매수 OOO억 / 거래량 대비 O.O% / 상장주식수 대비 O.OO%
          • <b>거래 분석:</b> 당일 총 거래량 대비 순매수 비중 및 유통물량 흡수 특성 (객관적 팩트 1줄)

          <b>■ 3. 종목명 (현재가 / 등락률)</b>
          • <b>수급 지표:</b> 순매수 OOO억 / 거래량 대비 O.O% / 상장주식수 대비 O.OO%
          • <b>거래 분석:</b> 당일 총 거래량 대비 순매수 비중 및 유통물량 흡수 특성 (객관적 팩트 1줄)

          ━━━━━━━━━━━━━━━━━━━
          <b>3. 🛡️ 기관 순매수 비중 상위</b>

          <b>■ 1. 종목명 (현재가 / 등락률)</b>
          • <b>수급 지표:</b> 순매수 OOO억 / 거래량 대비 O.O% / 상장주식수 대비 O.OO%
          • <b>거래 분석:</b> 당일 총 거래량 대비 순매수 비중 및 매수 특성 (객관적 팩트 1줄)

          <b>■ 2. 종목명 (현재가 / 등락률)</b>
          • <b>수급 지표:</b> 순매수 OOO억 / 거래량 대비 O.O% / 상장주식수 대비 O.OO%
          • <b>거래 분석:</b> 당일 총 거래량 대비 순매수 비중 및 매수 특성 (객관적 팩트 1줄)

          <b>■ 3. 종목명 (현재가 / 등락률)</b>
          • <b>수급 지표:</b> 순매수 OOO억 / 거래량 대비 O.O% / 상장주식수 대비 O.OO%
          • <b>거래 분석:</b> 당일 총 거래량 대비 순매수 비중 및 매수 특성 (객관적 팩트 1줄)

          ━━━━━━━━━━━━━━━━━━━
          <b>4. 🔥 외인·기관 동시 순매수 (쌍끌이 집중)</b>

          <b>■ 1. 종목명 (현재가 / 등락률)</b>
          • <b>합산 수급:</b> 외국인 OOO억 + 기관 OOO억 (합산 OOO억 / 거래량 대비 O.O%)
          • <b>수급 팩트:</b> 양대 주체의 동시 매집 규모 및 수급 쏠림 분석 (객관적 팩트 1줄)

          <b>■ 2. 종목명 (현재가 / 등락률)</b>
          • <b>합산 수급:</b> 외국인 OOO억 + 기관 OOO억 (합산 OOO억 / 거래량 대비 O.O%)
          • <b>수급 팩트:</b> 양대 주체의 동시 매집 규모 및 수급 쏠림 분석 (객관적 팩트 1줄)

          ━━━━━━━━━━━━━━━━━━━
          <b>5. 💡 수급 특이사항 요약</b>

          • 총 거래량 대비 메이저 수급 집중도가 높게 나타난 종목군 및 시장 쏠림 현상 정리 (2줄 이내)
          """

          gemini_api_url = f"{HTTP_SCHEME}{GEMINI_DOMAIN}/v1beta/models/gemini-3.6-flash:generateContent"
          payload = {"contents": [{"parts": [{"text": prompt}]}]}

          report_text = None
          max_retries = 3

          for attempt in range(1, max_retries + 1):
              print(f"2. Gemini 리포트 생성 중... (시도 {attempt}/{max_retries})")
              try:
                  g_res = requests.post(
                      gemini_api_url,
                      params={"key": gemini_key},
                      headers={"Content-Type": "application/json"},
                      data=json.dumps(payload),
                      timeout=90
                  )
                  if g_res.status_code == 200:
                      report_text = g_res.json()["candidates"][0]["content"]["parts"][0]["text"]
                      break
                  else:
                      print(f"Gemini API 에러 ({g_res.status_code}): {g_res.text}")
              except Exception as e:
                  print(f"Gemini 호출 오류: {e}")
              time.sleep(3)

          if not report_text:
              print("❌ Gemini 리포트 생성 실패")
              sys.exit(1)

          report_text = report_text.replace("```html", "").replace("```", "").replace("<code>", "").replace("</code>", "").strip()
          report_text = re.sub(r'(━━━━━━━━━━━━━━━━━━━)(\s*)([1-5]\.)', r'\1\n\n<b>\3', report_text)
          report_text = re.sub(r'([^\n])(\s*)(■ \d\.)', r'\1\n\n\3', report_text)

          # -------------------------------------------------------------
          # 4. 무음 분할 전송 엔진 (HTML 실패 시 순수 텍스트 자동 폴백)
          # -------------------------------------------------------------
          print(f"3. 텔레그램 무음 메시지 발송 시작 (대상 Chat ID: {chat_id})...")
          tg_send_url = f"{tg_base_url}/sendMessage"

          # 3,500자 단위 안전 분할
          def split_message(text, max_len=3500):
              chunks = []
              while len(text) > max_len:
                  split_idx = text.rfind('\n\n', 0, max_len)
                  if split_idx == -1:
                      split_idx = text.rfind('\n', 0, max_len)
                  if split_idx == -1:
                      split_idx = max_len
                  chunks.append(text[:split_idx].strip())
                  text = text[split_idx:].strip()
              if text:
                  chunks.append(text)
              return chunks

          chunks = split_message(report_text)
          all_success = True

          for idx, chunk in enumerate(chunks):
              # 1차 시도: HTML 파싱 모드 + 무음 전송
              payload = {
                  "chat_id": chat_id,
                  "text": chunk,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": True,
                  "disable_notification": True
              }
              res = requests.post(tg_send_url, json=payload, timeout=15)
              res_data = res.json()

              if res.status_code == 200 and res_data.get("ok"):
                  c_title = res_data["result"].get("chat", {}).get("title", res_data["result"].get("chat", {}).get("first_name", "대화방"))
                  print(f"[{idx+1}/{len(chunks)}] ✅ 무음 발송 성공! (방: {c_title})")
              else:
                  print(f"[{idx+1}/{len(chunks)}] ⚠️ HTML 전송 실패 -> 일반 텍스트 모드로 즉시 재전송...")
                  # 2차 시도: 모든 HTML 태그 제거 후 순수 텍스트 모드로 무조건 발송
                  plain_chunk = re.sub(r'<[^>]+>', '', chunk)
                  fallback_payload = {
                      "chat_id": chat_id,
                      "text": plain_chunk,
                      "disable_web_page_preview": True,
                      "disable_notification": True
                  }
                  f_res = requests.post(tg_send_url, json=fallback_payload, timeout=15)
                  f_data = f_res.json()
                  if f_res.status_code == 200 and f_data.get("ok"):
                      print(f"[{idx+1}/{len(chunks)}] ✅ 일반 텍스트 무음 발송 성공!")
                  else:
                      print(f"[{idx+1}/{len(chunks)}] ❌ 전송 최종 실패: {f_data.get('description', f_res.text)}")
                      all_success = False

          if not all_success:
              print("❌ 텔레그램 메시지 전송 실패. Chat ID와 봇 권한을 확인하세요.")
              sys.exit(1)

          print("🎉 리포트 무음 발송 프로세스 완료!")
          EOF

          python run_agent.py
