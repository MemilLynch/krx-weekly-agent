name: Daily KRX Quant Agent

on:
  schedule:
    - cron: '10 7 * * 1-5' # KST 16:10
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install requests pandas pykrx

      - name: 사모펀드/기관 수급 분석 및 텔레그램 전송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > run_agent.py
          import os, sys, time, datetime, re, requests, traceback
          import pandas as pd
          from pykrx import stock

          # -------------------------------------------------------------
          # 0. 환경변수 및 텔레그램 함수 설정
          # -------------------------------------------------------------
          gemini_key = os.getenv("GEMINI_API_KEY", "").strip('\'"')
          bot_token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip('\'"')
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip('\'"')

          if bot_token.lower().startswith("bot"): bot_token = bot_token[3:]
          tg_base_url = f"https://api.telegram.org/bot{bot_token}"

          def send_tg(text):
              try:
                  r = requests.post(tg_base_url + "/sendMessage", json={
                      "chat_id": chat_id, "text": text, "parse_mode": "HTML",
                      "disable_web_page_preview": True, "disable_notification": True
                  }, timeout=15)
                  if r.json().get("ok"): return True
                  
                  clean_text = text.replace("<b>", "").replace("</b>", "").replace("<", "").replace(">", "")
                  r2 = requests.post(tg_base_url + "/sendMessage", json={
                      "chat_id": chat_id, "text": f"⚠️ HTML 포맷 에러로 일반 텍스트 발송\n\n{clean_text}",
                      "disable_web_page_preview": True, "disable_notification": True
                  }, timeout=15)
                  return r2.json().get("ok")
              except Exception as e:
                  print("Telegram 전송 실패:", e)
                  return False

          if not gemini_key or not bot_token or not chat_id:
              print("❌ 환경변수 누락")
              sys.exit(1)

          try:
              # -------------------------------------------------------------
              # 1. 영업일 탐색 (while문으로 확실한 데이터 존재일 탐색)
              # -------------------------------------------------------------
              today_dt = datetime.datetime.today()
              target_date = today_dt.strftime("%Y%m%d")
              
              print(f"[{target_date}] 코스피 데이터 확인 중...")
              ohlcv_test = stock.get_market_ohlcv(target_date, market="KOSPI")
              
              days_ago = 0
              # 주말이거나 장 마감 전이라 데이터가 비어있으면 하루씩 뺌 (최대 10일)
              while ohlcv_test.empty and days_ago < 10:
                  days_ago += 1
                  target_date = (today_dt - datetime.timedelta(days=days_ago)).strftime("%Y%m%d")
                  ohlcv_test = stock.get_market_ohlcv(target_date, market="KOSPI")
              
              target_print = target_date[:4] + "-" + target_date[4:6] + "-" + target_date[6:]
              print(f"✅ 최종 기준일자 확정: {target_print}")

              # -------------------------------------------------------------
              # 2. 전체 시장 메타데이터 로드
              # -------------------------------------------------------------
              print("메타데이터 및 수급 데이터 로드 중...")
              ohlcv_kdq = stock.get_market_ohlcv(target_date, market="KOSDAQ")
              ohlcv = pd.concat([ohlcv_test, ohlcv_kdq])
              
              cap = pd.concat([
                  stock.get_market_cap(target_date, market="KOSPI"),
                  stock.get_market_cap(target_date, market="KOSDAQ")
              ])
              meta_df = pd.merge(ohlcv, cap[['상장주식수']], left_index=True, right_index=True)

              def get_investor_data(inv_name):
                  try:
                      kpi = stock.get_market_net_purchases_of_equities_by_ticker(target_date, target_date, "KOSPI", inv_name)
                      kdq = stock.get_market_net_purchases_of_equities_by_ticker(target_date, target_date, "KOSDAQ", inv_name)
                      return pd.concat([kpi, kdq])
                  except:
                      return pd.DataFrame()

              df_inst = get_investor_data("기관합계")
              df_samo = get_investor_data("사모펀드")

              # -------------------------------------------------------------
              # 3. 데이터 정제 및 Top N 추출
              # -------------------------------------------------------------
              pattern = "TIGER|KODEX|ACE|RISE|SOL|PLUS|KBSTAR|KOSEF|스팩|레버리지|인버스|ETN|선물"

              def process_top_stocks(df, top_n):
                  if df.empty: return []
                  
                  df = df[df['순매수거래대금'] > 0]
                  merged = df.join(meta_df, how='inner')
                  merged = merged[~merged['종목명'].str.contains(pattern, regex=True, na=False)]
                  
                  top_df = merged.sort_values(by='순매수거래대금', ascending=False).head(top_n).copy()
                  
                  results = []
                  for ticker, row in top_df.iterrows():
                      amt_억 = round(row['순매수거래대금'] / 100000000, 1)
                      vol_ratio = round((row['순매수거래량'] / row['거래량']) * 100, 2) if row.get('거래량', 0) > 0 else 0.0
                      share_ratio = round((row['순매수거래량'] / row['상장주식수']) * 100, 3) if row.get('상장주식수', 0) > 0 else 0.0
                      
                      txt = f"{row['종목명']} ({row['종가']:,}원 / {row['등락률']}%) | 순매수 {amt_억:,}억 | 거래량대비 {vol_ratio}% | 주식수대비 {share_ratio}%"
                      results.append(txt)
                  return results

              inst_list = process_top_stocks(df_inst, 3)
              samo_list = process_top_stocks(df_samo, 5)

              inst_str = "\n".join([f"{i+1}. {txt}" for i, txt in enumerate(inst_list)]) if inst_list else "당일 기관 매수 종목 없음"
              samo_str = "\n".join([f"{i+1}. {txt}" for i, txt in enumerate(samo_list)]) if samo_list else "당일 사모펀드 매수 종목 없음"

              # -------------------------------------------------------------
              # 4. Gemini 프롬프트 및 리포트 생성
              # -------------------------------------------------------------
              prompt = f"""
              오늘({target_print}) 국내 증시 수급 데이터다.

              [기관합계 수급 상위 3종목 (금액순)]
              {inst_str}

              [사모펀드 수급 상위 5종목 (금액순)]
              {samo_str}

              [★ 엄격 통제 지시사항 ★]
              1. 위에서 제공된 종목명, 가격, 비중 숫자를 단 하나도 바꾸거나 지어내지 말고 100% 똑같이 복사해서 써라.
              2. 데이터가 없으면 '종목 없음'이라고 명시해라.
              3. 증권사 퀀트 데스크의 드라이(Dry)한 어조로 객관적 팩트만 서술해라.
              4. <b> 텍스트 </b> 외의 모든 마크다운(##, **, ``` 등) 사용 금지. 단독 < 또는 > 기호 절대 금지.

              [★ 출력 템플릿 ★]
              <b>📊 [{target_print}] 스마트머니 수급 브리핑</b>

              ━━━━━━━━━━━━━━━━━━━
              <b>1. 🛡️ 기관계 순매수 상위 3선</b>

              <b>■ 1. 종목명 (현재가 / 등락률)</b>
              • <b>수급 팩트:</b> 순매수 OOO억 / 거래량 대비 O.O%
              • <b>분석:</b> (객관적 코멘트 1줄)

              (2위, 3위 동일하게 작성)

              ━━━━━━━━━━━━━━━━━━━
              <b>2. 🕵️ 사모펀드 매집 상위 5선</b>

              <b>■ 1. 종목명 (현재가 / 등락률)</b>
              • <b>수급 팩트:</b> 순매수 OOO억 / 주식수 대비 O.OO%
              • <b>분석:</b> (가속도 및 유통물량 잠식 관점 코멘트 1줄)

              (2위부터 5위까지 동일하게 작성)

              ━━━━━━━━━━━━━━━━━━━
              <b>3. 💡 수급 특이사항 요약</b>
              • (오늘 사모펀드 및 기관 수급의 전반적인 방향성 1~2줄 요약)
              """

              gemini_url = f"[https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=](https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=){gemini_key}"
              payload = {"contents": [{"parts": [{"text": prompt}]}]}

              report_text = ""
              for attempt in range(1, 4):
                  res = requests.post(gemini_url, json=payload, timeout=60)
                  if res.status_code == 200:
                      report_text = res.json()["candidates"][0]["content"]["parts"][0]["text"]
                      break
                  time.sleep(3)

              if not report_text: 
                  raise Exception(f"Gemini 응답 실패. 상태코드: {res.status_code}, 메시지: {res.text}")

              report_text = report_text.replace("```html", "").replace("```", "").strip()

              if not send_tg(report_text):
                  raise Exception("텔레그램 전송 API에서 실패를 반환했습니다.")
              
              print("🎉 정상 실행 및 전송 완료")

          except Exception as e:
              error_msg = f"⚠️ [에러 발생] 퀀트 봇 실행 중 문제가 발생했습니다.\n\n{traceback.format_exc()}"
              print(error_msg)
              send_tg(error_msg)
              sys.exit(1)
          EOF

          python run_agent.py
