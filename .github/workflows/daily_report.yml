name: Daily KRX AI Agent

on:
  schedule:
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install pandas requests beautifulsoup4

      - name: 수급 데이터 수집 및 텔레그램 발송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > run_agent.py
          import os
          import sys
          import json
          import datetime
          import requests
          from bs4 import BeautifulSoup
          import pandas as pd

          gemini_key = os.getenv("GEMINI_API_KEY")
          bot_token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")

          if not all([gemini_key, bot_token, chat_id]):
              print("에러: GitHub Secrets 환경변수(3개)가 누락되었습니다.")
              sys.exit(1)

          print("1. 네이버 금융 코스피 외국인 순매수 데이터 수집 중...")
          url = "https://finance.naver.com/sise/sise_deal_rank.naver?investor_gubun=9000&type=buy&mkt_gb=1"
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          }
          res = requests.get(url, headers=headers)
          res.encoding = "cp949"

          if res.status_code != 200:
              print(f"데이터 수집 실패: HTTP {res.status_code}")
              sys.exit(1)

          soup = BeautifulSoup(res.text, "html.parser")
          data_list = []

          for tr in soup.find_all("tr"):
              tds = [td.get_text(strip=True) for td in tr.find_all("td")]
              # 순위(숫자), 종목명, 현재가, 전일비, 등락률, 매수량, 순매수대금(백만원)
              if len(tds) >= 7 and tds[0].isdigit():
                  data_list.append({
                      "순위": int(tds[0]),
                      "종목명": tds[1],
                      "현재가": tds[2],
                      "등락률": tds[4],
                      "순매수거래량(주)": tds[5],
                      "순매수대금(백만원)": tds[6]
                  })

          if not data_list:
              print("데이터 파싱 실패: 집계 데이터가 없습니다.")
              sys.exit(1)

          # 상위 20개 종목 추출
          df = pd.DataFrame(data_list[:20])
          data_str = df.to_string(index=False)
          today = datetime.datetime.now().strftime("%Y-%m-%d")
          print(f"데이터 수집 성공 ({len(df)}개 종목)")

          print("2. AI 분석 리포트 생성 중...")
          prompt = f"""
          아래는 오늘({today}) 코스피(KOSPI) 외국인 순매수 상위 20개 종목 공식 데이터다 (단위: 백만원):
          {data_str}

          위 데이터를 기반으로 다음 형식의 보고서를 작성해라:
          1. 순매수 상위 1위~10위 종목 테이블 (순위, 종목명, 순매수대금(억 원 환산), 순매수거래량, 등락률)
          2. 순매수 상위 TOP 3 섹터 및 수급 특징 요약 (실제 데이터에 근거할 것)
          """

          g_url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key={gemini_key}"
          g_res = requests.post(
              g_url,
              headers={"Content-Type": "application/json"},
              data=json.dumps({"contents": [{"parts": [{"text": prompt}]}]})
          )

          if g_res.status_code != 200:
              print(f"Gemini API 에러: {g_res.text}")
              sys.exit(1)

          report_text = f"📊 [{today}] 코스피 외국인 수급 에이전트 리포트\n\n" + g_res.json()["candidates"][0]["content"]["parts"][0]["text"]

          print("3. 텔레그램 발송 중...")
          tg_url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          t_res = requests.post(tg_url, data={"chat_id": chat_id, "text": report_text})

          if t_res.status_code == 200:
              print("🎉 텔레그램 발송 성공 완료!")
          else:
              print(f"텔레그램 발송 실패: {t_res.text}")
              sys.exit(1)
          EOF

          python run_agent.py
