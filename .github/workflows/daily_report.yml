name: Daily KRX AI Agent

on:
  schedule:
    # 한국 시간(KST) 평일 16:10 자동 실행 (UTC 07:10)
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install requests beautifulsoup4 pandas

      - name: 수급 수집 및 고가독성 리포트 발송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > run_agent.py
          import os
          import sys
          import time
          import json
          import re
          import datetime
          import requests
          from bs4 import BeautifulSoup
          import pandas as pd

          # -------------------------------------------------------------
          # 0. 환경변수 정제 및 텔레그램 봇 사전 검증
          # -------------------------------------------------------------
          raw_gemini_key = os.getenv("GEMINI_API_KEY", "")
          raw_bot_token = os.getenv("TELEGRAM_BOT_TOKEN", "")
          raw_chat_id = os.getenv("TELEGRAM_CHAT_ID", "")

          gemini_key = raw_gemini_key.strip().strip("'").strip('"')
          bot_token = raw_bot_token.strip().strip("'").strip('"')
          chat_id = raw_chat_id.strip().strip("'").strip('"')

          if bot_token.lower().startswith("bot"):
              bot_token = bot_token[3:]

          if not all([gemini_key, bot_token, chat_id]):
              print("❌ 환경변수 오류: GitHub Secrets 3종(GEMINI_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)을 확인하세요.")
              sys.exit(1)

          HTTP_SCHEME = "https://"
          NAVER_DOMAIN = "finance.naver.com"
          GEMINI_DOMAIN = "generativelanguage.googleapis.com"
          TG_DOMAIN = "api.telegram.org"

          tg_base_url = f"{HTTP_SCHEME}{TG_DOMAIN}/bot{bot_token}"

          print("0. 텔레그램 봇 연결 상태 사전 확인 중...")
          try:
              chk = requests.get(f"{tg_base_url}/getMe", timeout=10)
              if chk.status_code == 200 and chk.json().get("ok"):
                  bot_name = chk.json()["result"].get("username", "UnknownBot")
                  print(f"✅ 텔레그램 봇 정상 확인: @{bot_name}")
              else:
                  print(f"❌ 텔레그램 토큰 오류 (코드 {chk.status_code}): {chk.text}")
                  print("GitHub Secrets의 TELEGRAM_BOT_TOKEN 값을 다시 확인해주세요.")
                  sys.exit(1)
          except Exception as e:
              print(f"❌ 텔레그램 서버 통신 실패: {e}")
              sys.exit(1)

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Referer": f"{HTTP_SCHEME}{NAVER_DOMAIN}/"
          }

          # -------------------------------------------------------------
          # 1. 양대 시장 외인/기관 순위 수집
          # -------------------------------------------------------------
          def fetch_deal_rank(mkt_gb, investor_gubun, top_n=10):
              url = f"{HTTP_SCHEME}{NAVER_DOMAIN}/sise/sise_deal_rank_iframe.naver?investor_gubun={investor_gubun}&type=buy&mkt_gb={mkt_gb}"
              res = requests.get(url, headers=headers, timeout=15)
              html_text = res.content.decode("cp949", errors="ignore")

              pattern = r'href=["\'][^"\']*code=(\d{6})["\'][^>]*>([^<]+)</a>'
              matches = list(re.finditer(pattern, html_text, re.IGNORECASE))

              data_list = []
              for i, match in enumerate(matches):
                  if len(data_list) >= top_n:
                      break

                  code = match.group(1)
                  name = match.group(2).strip()
                  if not name:
                      continue

                  start = match.end()
                  end = matches[i + 1].start() if i + 1 < len(matches) else start + 1500
                  chunk = html_text[start:end]

                  clean_chunk = re.sub(r'<[^>]+>', ' ', chunk).replace('&nbsp;', ' ')
                  tokens = [t.strip() for t in clean_chunk.split() if t.strip()]

                  cur_price = tokens[0] if len(tokens) > 0 else "-"
                  rate = next((t for t in tokens if "%" in t), "-")
                  num_tokens = [t for t in tokens if re.search(r'\d', t) and "%" not in t]

                  volume = num_tokens[-2] if len(num_tokens) >= 3 else (tokens[3] if len(tokens) > 3 else "-")
                  raw_amt = num_tokens[-1] if len(num_tokens) >= 2 else (tokens[-1] if tokens else "-")

                  clean_amt = re.sub(r'[^\d.]', '', raw_amt)
                  amt_100m = f"{round(float(clean_amt) / 100, 1):,}억" if clean_amt else raw_amt

                  data_list.append({
                      "순위": len(data_list) + 1,
                      "종목명": name,
                      "종목코드": code,
                      "현재가": cur_price,
                      "등락률": rate,
                      "순매수거래량": volume,
                      "순매수대금": amt_100m
                  })
              return pd.DataFrame(data_list)

          # -------------------------------------------------------------
          # 2. [5일선 > 20일선 & 주가 >= 5일선 & 5일 수급 집중] 3선 정밀 스크리닝
          # -------------------------------------------------------------
          def screen_technical_top3(candidate_dict):
              screened = []
              for name, code in candidate_dict.items():
                  url = f"{HTTP_SCHEME}{NAVER_DOMAIN}/item/frgn.naver?code={code}"
                  res = requests.get(url, headers=headers, timeout=15)
                  soup = BeautifulSoup(res.content.decode("cp949", errors="ignore"), "html.parser")

                  daily_data = []
                  for tr in soup.find_all("tr"):
                      tds = [td.get_text(strip=True) for td in tr.find_all("td")]
                      if len(tds) >= 7 and re.match(r'^\d{4}\.\d{2}\.\d{2}$', tds[0]):
                          try:
                              close_p = int(tds[1].replace(",", ""))
                              inst_v = int(tds[5].replace(",", "").replace("+", ""))
                              frgn_v = int(tds[6].replace(",", "").replace("+", ""))
                              daily_data.append({
                                  "price": close_p,
                                  "rate": tds[3],
                                  "inst": inst_v,
                                  "frgn": frgn_v
                              })
                          except:
                              continue
                          if len(daily_data) >= 20:
                              break

                  if len(daily_data) >= 5:
                      prices = [d["price"] for d in daily_data]
                      ma5 = sum(prices[:5]) / 5.0
                      len_20 = min(len(prices), 20)
                      ma20 = sum(prices[:len_20]) / float(len_20)
                      cur_price = prices[0]

                      sum_5d_inst = sum(d["inst"] for d in daily_data[:5])
                      sum_5d_frgn = sum(d["frgn"] for d in daily_data[:5])
                      total_5d_flow = sum_5d_inst + sum_5d_frgn

                      # 골든크로스/단기정배열 및 주가가 5일선 위에 안착한 종목
                      if cur_price >= ma5 and ma5 >= ma20:
                          screened.append({
                              "종목명": name,
                              "종목코드": code,
                              "현재가": f"{cur_price:,}원",
                              "등락률": daily_data[0]["rate"],
                              "5일선": f"{int(ma5):,}원",
                              "20일선": f"{int(ma20):,}원",
                              "5일누적외인": f"{sum_5d_frgn:+,}주",
                              "5일누적기관": f"{sum_5d_inst:+,}주",
                              "5일누적합산수급": total_5d_flow
                          })

              screened = sorted(screened, key=lambda x: x["5일누적합산수급"], reverse=True)
              top3 = screened[:3]
              for item in top3:
                  del item["5일누적합산수급"]
              return pd.DataFrame(top3)

          print("1. 양대 시장 랭킹 및 기술적 3종목 스크리닝 중...")
          df_kospi_foreign = fetch_deal_rank(mkt_gb=1, investor_gubun=9000, top_n=10)
          df_kospi_inst = fetch_deal_rank(mkt_gb=1, investor_gubun=1000, top_n=10)
          df_kosdaq_foreign = fetch_deal_rank(mkt_gb=2, investor_gubun=9000, top_n=10)
          df_kosdaq_inst = fetch_deal_rank(mkt_gb=2, investor_gubun=1000, top_n=10)

          all_candidates = {}
          for df in [df_kospi_foreign, df_kospi_inst, df_kosdaq_foreign, df_kosdaq_inst]:
              if not df.empty:
                  for _, r in df.iterrows():
                      if not any(k in r["종목명"] for k in ["TIGER", "KODEX", "ACE", "RISE", "레버리지", "인버스"]):
                          all_candidates[r["종목명"]] = r["종목코드"]

          df_top3_screened = screen_technical_top3(all_candidates)
          today = datetime.datetime.now().strftime("%Y-%m-%d")
          print(f"수집 완료: 기술적 필터링 통과 {len(df_top3_screened)}종목 선별")

          # -------------------------------------------------------------
          # 2. Gemini AI 냉혹한 수급 팩트 리포트 생성
          # -------------------------------------------------------------
          prompt = f"""
          오늘({today}) 국내 증시 공식 수급 데이터 및 기술적 필터링 결과다:

          [코스피 외국인 순매수 TOP 10]
          {df_kospi_foreign.to_string(index=False)}

          [코스피 기관 순매수 TOP 10]
          {df_kospi_inst.to_string(index=False)}

          [코스닥 외국인 순매수 TOP 10]
          {df_kosdaq_foreign.to_string(index=False)}

          [코스닥 기관 순매수 TOP 10]
          {df_kosdaq_inst.to_string(index=False)}

          [🔥 기술적 스크리닝 통과 3종목 (5일선>=20일선 & 주가>=5일선 & 5일 수급 상위)]
          {df_top3_screened.to_string(index=False)}

          [★ 핵심 작성 원칙 - 가독성 및 톤앤매너 ★]
          1. 텔레그램 모바일 화면에서 한눈에 깔끔히 보이도록 섹션, 종목 사이사이에 반드시 '빈 줄(줄바꿈 2번)'을 넣어라.
          2. 절대 맹목적인 장밋빛 상승론(Bullish)을 펼치지 마라. 수급이 꼬였거나 외인/기관이 단타로 털고 나간 종목(설거지)은 '단기 고점 징후', '윗꼬리 폭탄 주의', '수급 이탈' 등 거칠고 냉정하게 팩트 폭격해라.
          3. <code> 태그 및 백틱(```), 마크다운 표(|---|), 마크다운 볼드(**) 절대 금지.
          4. 강조 제목과 소제목은 오직 <b>텍스트</b> 태그만 사용해라.
          5. 단독 < 또는 > 기호는 절대 쓰지 마라. (텔레그램 HTML 오류 방지)

          [★ 출력 레이아웃 템플릿 ★]
          <b>📊 [{today}] 증시 수급 실상 & 기술적 주도주 3선</b>

          ━━━━━━━━━━━━━━━━━━━
          <b>1. 📌 오늘 시장 수급 실상</b>

          • 시장 수급 쏠림, 외인/기관의 페이크 매수 및 하방 압력 팩트 요약 (1~2줄)

          ━━━━━━━━━━━━━━━━━━━
          <b>2. 🏆 시장별 순매수 TOP 5</b>

          <b>[코스피 외인]</b>
          1. 종목명 (순매수대금 / 등락률)
          2. 종목명 (순매수대금 / 등락률)
          3. 종목명 (순매수대금 / 등락률)
          4. 종목명 (순매수대금 / 등락률)
          5. 종목명 (순매수대금 / 등락률)

          <b>[코스피 기관]</b>
          1. 종목명 (순매수대금 / 등락률)
          2. 종목명 (순매수대금 / 등락률)
          3. 종목명 (순매수대금 / 등락률)
          4. 종목명 (순매수대금 / 등락률)
          5. 종목명 (순매수대금 / 등락률)

          <b>[코스닥 외인]</b>
          1. 종목명 (순매수대금 / 등락률)
          2. 종목명 (순매수대금 / 등락률)
          3. 종목명 (순매수대금 / 등락률)
          4. 종목명 (순매수대금 / 등락률)
          5. 종목명 (순매수대금 / 등락률)

          <b>[코스닥 기관]</b>
          1. 종목명 (순매수대금 / 등락률)
          2. 종목명 (순매수대금 / 등락률)
          3. 종목명 (순매수대금 / 등락률)
          4. 종목명 (순매수대금 / 등락률)
          5. 종목명 (순매수대금 / 등락률)

          ━━━━━━━━━━━━━━━━━━━
          <b>3. 🔥 골든크로스 & 5일 수급 주도주 3선</b>

          <b>■ 1. 종목명 (현재가 / 등락률)</b>
          • <b>이평선:</b> 5일선 OOO원 / 20일선 OOO원
          • <b>5일 누적:</b> 외인 OOO주 / 기관 OOO주
          • <b>차트 팩트:</b> 단기 반등 모멘텀 실상 1줄
          • <b>경계 라인:</b> 이탈 시 손절해야 하는 가격대 직설 경고

          <b>■ 2. 종목명 (현재가 / 등락률)</b>
          • <b>이평선:</b> 5일선 OOO원 / 20일선 OOO원
          • <b>5일 누적:</b> 외인 OOO주 / 기관 OOO주
          • <b>차트 팩트:</b> 단기 반등 모멘텀 실상 1줄
          • <b>경계 라인:</b> 이탈 시 손절해야 하는 가격대 직설 경고

          <b>■ 3. 종목명 (현재가 / 등락률)</b>
          • <b>이평선:</b> 5일선 OOO원 / 20일선 OOO원
          • <b>5일 누적:</b> 외인 OOO주 / 기관 OOO주
          • <b>차트 팩트:</b> 단기 반등 모멘텀 실상 1줄
          • <b>경계 라인:</b> 이탈 시 손절해야 하는 가격대 직설 경고

          ━━━━━━━━━━━━━━━━━━━
          <b>4. 💡 내일장 수급 경계령 & 체크포인트</b>

          • 조심해야 할 윗꼬리 매물 및 페이크 수급 주의점 정리 (2줄 이내)
          """

          gemini_api_url = f"{HTTP_SCHEME}{GEMINI_DOMAIN}/v1beta/models/gemini-3.6-flash:generateContent"
          payload = {"contents": [{"parts": [{"text": prompt}]}]}

          report_text = None
          max_retries = 3

          for attempt in range(1, max_retries + 1):
              print(f"2. Gemini AI 리포트 생성 중... (시도 {attempt}/{max_retries})")
              try:
                  g_res = requests.post(
                      gemini_api_url,
                      params={"key": gemini_key},
                      headers={"Content-Type": "application/json"},
                      data=json.dumps(payload),
                      timeout=90
                  )
                  if g_res.status_code == 200:
                      report_text = g_res.json()["candidates"][0]["content"]["parts"][0]["text"]
                      break
                  else:
                      print(f"Gemini API 에러 ({g_res.status_code}): {g_res.text}")
              except requests.exceptions.Timeout:
                  print(f"응답 시간 초과 (시도 {attempt}/{max_retries})")
              except Exception as e:
                  print(f"Gemini 호출 오류: {e}")

              if attempt < max_retries:
                  time.sleep(3)

          if not report_text:
              print("❌ Gemini AI 리포트 생성 최종 실패")
              sys.exit(1)

          report_text = report_text.replace("```html", "").replace("```", "").replace("<code>", "").replace("</code>", "").strip()

          # -------------------------------------------------------------
          # 3. 텔레그램 분할 및 안전 발송
          # -------------------------------------------------------------
          print("3. 텔레그램 메시지 발송 시작...")
          tg_send_url = f"{tg_base_url}/sendMessage"

          def send_to_telegram(msg_text):
              chunks = [msg_text[i:i+3800] for i in range(0, len(msg_text), 3800)] if len(msg_text) > 3800 else [msg_text]
              success = True

              for idx, chunk in enumerate(chunks):
                  res = requests.post(tg_send_url, json={
                      "chat_id": chat_id,
                      "text": chunk,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": True
                  }, timeout=15)

                  if res.status_code == 200:
                      print(f"[{idx+1}/{len(chunks)}] ✅ 텔레그램 HTML 발송 성공!")
                  else:
                      print(f"[{idx+1}/{len(chunks)}] ⚠️ HTML 모드 실패 ({res.status_code}): {res.text}")
                      print("HTML 태그를 제거하고 일반 텍스트로 즉시 재발송합니다...")
                      plain_chunk = re.sub(r'<[^>]+>', '', chunk)
                      res_fallback = requests.post(tg_send_url, json={
                          "chat_id": chat_id,
                          "text": plain_chunk,
                          "disable_web_page_preview": True
                      }, timeout=15)

                      if res_fallback.status_code == 200:
                          print(f"[{idx+1}/{len(chunks)}] ✅ 텔레그램 일반 텍스트 발송 성공!")
                      else:
                          print(f"[{idx+1}/{len(chunks)}] ❌ 텔레그램 최종 실패 ({res_fallback.status_code}): {res_fallback.text}")
                          success = False

              return success

          if not send_to_telegram(report_text):
              print("❌ 에러: 텔레그램 메시지 전송 실패")
              sys.exit(1)

          print("🎉 기술적 3선 기반 냉혹한 수급 리포트 발송 성공 완료!")
          EOF

          python run_agent.py
