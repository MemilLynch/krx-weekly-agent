name: Daily KRX Quant Agent

on:
  schedule:
    - cron: '40 8 * * 1-5'   # KST 17:40
  workflow_dispatch:
    inputs:
      probe_only:
        description: '데이터 소스 진단만 수행 (텔레그램 발송 안 함)'
        type: boolean
        default: false
      force_date:
        description: '기준일 강제 지정 (YYYYMMDD, 비우면 자동)'
        default: ''

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install requests pandas beautifulsoup4 lxml

      - name: 수급 분석 실행
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          PROBE_ONLY:  ${{ inputs.probe_only }}
          FORCE_DATE:  ${{ inputs.force_date }}
        run: python run_agent.py

      - name: 디버그 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dump
          path: debug/
          if-no-files-found: ignore
          retention-days: 7
