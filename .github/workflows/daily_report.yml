name: Daily KRX AI Agent

on:
  schedule:
    # 한국 시간(KST) 평일 16:10 자동 실행 (UTC 07:10)
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: pip install requests beautifulsoup4 pandas

      - name: 수급 수집 및 AI 리포트 발송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat << 'EOF' > run_agent.py
          import os
          import sys
          import json
          import re
          import datetime
          import requests
          from bs4 import BeautifulSoup
          import pandas as pd

          # -------------------------------------------------------------
          # [관심 종목 설정] 원하는 종목명과 6자리 종목코드
          # -------------------------------------------------------------
          MY_WATCHLIST = {
              "삼성전자": "005930",
              "SK하이닉스": "000660",
              "현대차": "005380",
              "NAVER": "035420"
          }

          gemini_key = os.getenv("GEMINI_API_KEY")
          bot_token = os.getenv("TELEGRAM_BOT_TOKEN")
          chat_id = os.getenv("TELEGRAM_CHAT_ID")

          if not all([gemini_key, bot_token, chat_id]):
              print("환경변수 오류: GitHub Secrets 3종을 확인하세요.")
              sys.exit(1)

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
              "Referer": "https://finance.naver.com/"
          }

          # 1. 양대 시장 외인/기관 순위 수집 (검증된 정규식 토큰 파서)
          def fetch_deal_rank(mkt_gb, investor_gubun, top_n=10):
              url = f"https://finance.naver.com/sise/sise_deal_rank_iframe.naver?investor_gubun={investor_gubun}&type=buy&mkt_gb={mkt_gb}"
              res = requests.get(url, headers=headers, timeout=15)
              html_text = res.content.decode("cp949", errors="ignore")

              pattern = r'href=["\'][^"\']*code=(\d{6})["\'][^>]*>([^<]+)</a>'
              matches = list(re.finditer(pattern, html_text, re.IGNORECASE))

              data_list = []
              for i, match in enumerate(matches):
                  if len(data_list) >= top_n:
                      break

                  code = match.group(1)
                  name = match.group(2).strip()
                  if not name:
                      continue

                  start = match.end()
                  end = matches[i + 1].start() if i + 1 < len(matches) else start + 1500
                  chunk = html_text[start:end]

                  clean_chunk = re.sub(r'<[^>]+>', ' ', chunk).replace('&nbsp;', ' ')
                  tokens = [t.strip() for t in clean_chunk.split() if t.strip()]

                  cur_price = tokens[0] if len(tokens) > 0 else "-"
                  rate = next((t for t in tokens if "%" in t), "-")
                  num_tokens = [t for t in tokens if re.search(r'\d', t) and "%" not in t]

                  volume = num_tokens[-2] if len(num_tokens) >= 3 else (tokens[3] if len(tokens) > 3 else "-")
                  raw_amt = num_tokens[-1] if len(num_tokens) >= 2 else (tokens[-1] if tokens else "-")

                  clean_amt = re.sub(r'[^\d.]', '', raw_amt)
                  if clean_amt:
                      try:
                          amt_100m = f"{round(float(clean_amt) / 100, 1):,}억"
                      except Exception:
                          amt_100m = raw_amt
                  else:
                      amt_100m = raw_amt

                  data_list.append({
                      "순위": len(data_list) + 1,
                      "종목명": name,
                      "종목코드": code,
                      "현재가": cur_price,
                      "등락률": rate,
                      "순매수거래량": volume,
                      "순매수대금": amt_100m
                  })
              return pd.DataFrame(data_list)

          # 2. 관심 종목 최근 5영업일 수급 누적 및 연속성 계산
          def fetch_watchlist_5d_trend(watchlist_dict):
              res_list = []
              for name, code in watchlist_dict.items():
                  url = f"https://finance.naver.com/item/frgn.naver?code={code}"
                  res = requests.get(url, headers=headers, timeout=15)
                  soup = BeautifulSoup(res.content.decode("cp949", errors="ignore"), "html.parser")

                  daily_rows = []
                  for tr in soup.find_all("tr"):
                      tds = [td.get_text(strip=True) for td in tr.find_all("td")]
                      if len(tds) >= 7 and re.match(r'^\d{4}\.\d{2}\.\d{2}$', tds[0]):
                          try:
                              inst_num = int(tds[5].replace(",", "").replace("+", ""))
                          except:
                              inst_num = 0
                          try:
                              frgn_num = int(tds[6].replace(",", "").replace("+", ""))
                          except:
                              frgn_num = 0

                          daily_rows.append({
                              "date": tds[0],
                              "price": tds[1],
                              "rate": tds[3],
                              "inst": inst_num,
                              "frgn": frgn_num,
                              "inst_str": tds[5],
                              "frgn_str": tds[6]
                          })
                          if len(daily_rows) >= 5:
                              break

                  if daily_rows:
                      today_data = daily_rows[0]
                      inst_5d_sum = sum(r["inst"] for r in daily_rows)
                      frgn_5d_sum = sum(r["frgn"] for r in daily_rows)

                      def get_streak(rows, key):
                          if not rows or rows[0][key] == 0:
                              return "보합"
                          target_sign = 1 if rows[0][key] > 0 else -1
                          streak = 0
                          for r in rows:
                              sign = 1 if r[key] > 0 else (-1 if r[key] < 0 else 0)
                              if sign == target_sign:
                                  streak += 1
                              else:
                                  break
                          action = "연속 매수" if target_sign > 0 else "연속 매도"
                          return f"{streak}일 {action}"

                      res_list.append({
                          "종목명": name,
                          "현재가": today_data["price"],
                          "등락률": today_data["rate"],
                          "당일 외인": today_data["frgn_str"],
                          "당일 기관": today_data["inst_str"],
                          "5일 누적 외인": f"{frgn_5d_sum:+,}주",
                          "외인 연속성": get_streak(daily_rows, "frgn"),
                          "5일 누적 기관": f"{inst_5d_sum:+,}주",
                          "기관 연속성": get_streak(daily_rows, "inst")
                      })
              return pd.DataFrame(res_list)

          print("1. 양대 시장 랭킹 및 관심종목 5일 수급 데이터 수집 중...")
          df_kospi_foreign = fetch_deal_rank(mkt_gb=1, investor_gubun=9000, top_n=10)
          df_kospi_inst = fetch_deal_rank(mkt_gb=1, investor_gubun=1000, top_n=10)
          df_kosdaq_foreign = fetch_deal_rank(mkt_gb=2, investor_gubun=9000, top_n=10)
          df_kosdaq_inst = fetch_deal_rank(mkt_gb=2, investor_gubun=1000, top_n=10)
          df_watchlist = fetch_watchlist_5d_trend(MY_WATCHLIST)

          today = datetime.datetime.now().strftime("%Y-%m-%d")
          print(f"수집 완료: 코스피 외인({len(df_kospi_foreign)}개), 기관({len(df_kospi_inst)}개), 코스닥 외인({len(df_kosdaq_foreign)}개), 기관({len(df_kosdaq_inst)}개), 관심종목({len(df_watchlist)}개)")

          # 2. Gemini AI 리포트 생성 (일반 텍스트 및 <b> 태그만 사용)
          print("2. Gemini AI 종합 수급 분석 리포트 생성 중...")
          prompt = f"""
          오늘({today}) 국내 증시 공식 수급 집계 데이터다:

          [코스피 외국인 순매수 TOP 10]
          {df_kospi_foreign.to_string(index=False)}

          [코스피 기관 순매수 TOP 10]
          {df_kospi_inst.to_string(index=False)}

          [코스닥 외국인 순매수 TOP 10]
          {df_kosdaq_foreign.to_string(index=False)}

          [코스닥 기관 순매수 TOP 10]
          {df_kosdaq_inst.to_string(index=False)}

          [⭐ 내 관심종목 5일 수급 현황]
          {df_watchlist.to_string(index=False)}

          [★ 필수 서식 규칙 ★]
          1. <code> 태그 및 백틱(```)은 절대 사용하지 마라. (터치 시 복사되는 보라색 박스 방지)
          2. 마크다운 표(|---|)나 마크다운 볼드(**)를 쓰지 마라.
          3. 강조하고 싶은 제목과 핵심 단어는 오직 <b>텍스트</b> 태그만 사용해라.
          4. 숫자와 가격, 등락률은 일반 글자로 작성해라. (예: 75,000원 (+1.5%))

          [출력 템플릿]
          <b>📊 [{today}] 코스피·코스닥 수급 및 관심종목 종합 브리핑</b>

          <b>1. 📌 오늘 시장 핵심 요약</b>
          • 1~2줄 핵심 요약

          <b>2. 🔥 외인·기관 쌍끌이 순매수 및 주도 섹터</b>
          • 양대 시장 공통 매수 특징 및 핵심 섹터 분석

          <b>3. 🏆 시장별 순매수 TOP 5</b>
          • <b>[코스피 외인]</b> 1위~5위 종목명 (순매수대금 / 등락률)
          • <b>[코스피 기관]</b> 1위~5위 종목명 (순매수대금 / 등락률)
          • <b>[코스닥 외인]</b> 1위~5위 종목명 (순매수대금 / 등락률)
          • <b>[코스닥 기관]</b> 1위~5위 종목명 (순매수대금 / 등락률)

          <b>4. ⭐ 내 관심종목 5일 수급 집중 분석</b>
          • 종목별로 당일 수급, 5일 누적 수급, 연속 순매수/매도 일수를 깔끔하게 정리하고 코멘트 작성

          <b>5. 💡 내일장 관전 포인트</b>
          • 수급 관점 핵심 체크 포인트
          """

          g_url = f"[https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=](https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=){gemini_key}"
          payload = {"contents": [{"parts": [{"text": prompt}]}]}
          g_res = requests.post(g_url, headers={"Content-Type": "application/json"}, data=json.dumps(payload))

          if g_res.status_code != 200:
              print(f"Gemini API 에러: {g_res.text}")
              sys.exit(1)

          report_text = g_res.json()["candidates"][0]["content"]["parts"][0]["text"]
          report_text = report_text.replace("```html", "").replace("```", "").replace("<code>", "").replace("</code>", "").strip()

          # 3. 텔레그램 발송
          print("3. 텔레그램 메시지 발송 중...")
          tg_url = f"[https://api.telegram.org/bot](https://api.telegram.org/bot){bot_token}/sendMessage"

          def send_telegram_html(text):
              if len(text) <= 4000:
                  res = requests.post(tg_url, json={
                      "chat_id": chat_id,
                      "text": text,
                      "parse_mode": "HTML",
                      "disable_web_page_preview": True
                  })
                  if res.status_code != 200:
                      requests.post(tg_url, json={"chat_id": chat_id, "text": text})
              else:
                  chunks = [text[i:i+3800] for i in range(0, len(text), 3800)]
                  for chunk in chunks:
                      requests.post(tg_url, json={
                          "chat_id": chat_id,
                          "text": chunk,
                          "parse_mode": "HTML",
                          "disable_web_page_preview": True
                      })

          send_telegram_html(report_text)
          print("🎉 시장 랭킹과 관심종목 수급 발송 완료!")
          EOF

          python run_agent.py
